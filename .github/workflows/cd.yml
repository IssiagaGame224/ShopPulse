# CD ShopPulse (chapitre docs/30) — publie les images Docker api/web sur GHCR.
#
# Déclenchement : quand la CI se termine AVEC SUCCÈS sur main (workflow_run) —
# jamais d'image publiée depuis un commit rouge. workflow_dispatch permet un
# lancement manuel (test, reprise).
#
# Tags : ghcr.io/<owner>/shoppulse-<service>:<sha du commit> (traçabilité) et
# :latest (uniquement depuis main). Le GITHUB_TOKEN suffit (permissions packages).
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publication GHCR (${{ matrix.service }})
    # workflow_run : seulement si la CI a réussi ; dispatch manuel : toujours.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
    steps:
      # Le SHA validé par la CI, pas nécessairement le dernier de main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Préfixe d'image en minuscules (GHCR l'exige)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/ShopPulse.${{ matrix.service == 'api' && 'Api' || 'Web' }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/shoppulse-${{ matrix.service }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ${{ github.event_name == 'workflow_run' && format('{0}/shoppulse-{1}:latest', env.IMAGE_PREFIX, matrix.service) || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
